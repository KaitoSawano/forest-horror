name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        run: |
          mkdir -p $ANDROID_HOME/cmdline-tools
          cd $ANDROID_HOME/cmdline-tools
          if [ ! -d "latest" ]; then
            wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O cmdline.zip
            unzip -q cmdline.zip
            mv cmdline-tools latest || true
          fi
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" > /dev/null

      - name: Install dependencies
        run: npm install

      - name: Compile WASM
        run: |
          sudo apt-get update
          sudo apt-get install -y wabt
          wat2wasm tools/decrypt.wat -o src/lib/decrypt.wasm || true
          ls -la src/lib/decrypt.wasm || echo "WASM tidak dibuat, lanjut"

      - name: Encrypt JavaScript
        run: node tools/encrypt.js

      - name: Update webDir
        run: |
          sed -i 's/"webDir": "[^"]*"/"webDir": "src-encrypted"/' capacitor.config.json

      - name: Add Android platform
        run: npx cap add android

      - name: Set Android SDK path
        run: echo "sdk.dir=$ANDROID_HOME" > android/local.properties

      - name: Force fullscreen + landscape
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          
          # Set landscape orientation
          sed -i 's/android:screenOrientation="[^"]*"/android:screenOrientation="landscape"/g' $MANIFEST
          if ! grep -q 'android:screenOrientation' $MANIFEST; then
            sed -i 's/<activity/<activity android:screenOrientation="landscape"/' $MANIFEST
          fi
          
          # Tambah fullscreen theme
          if ! grep -q 'android:theme="@style/AppTheme.NoActionBar.Fullscreen"' $MANIFEST; then
            sed -i 's/android:theme="@style\/AppTheme.NoActionBar"/android:theme="@style\/AppTheme.NoActionBar.Fullscreen"/' $MANIFEST
          fi
          
          # Kalau belum ada theme sama sekali, tambah
          if ! grep -q 'android:theme' $MANIFEST; then
            sed -i 's/<activity/<activity android:theme="@style\/AppTheme.NoActionBar.Fullscreen"/' $MANIFEST
          fi

      - name: Create fullscreen theme
        run: |
          STYLES=android/app/src/main/res/values/styles.xml
          
          cat > $STYLES << 'EOF'
<?xml version="1.0" encoding="utf-8"?>
<resources>

    <style name="AppTheme" parent="Theme.AppCompat.Light.DarkActionBar">
        <item name="colorPrimary">@color/colorPrimary</item>
        <item name="colorPrimaryDark">@color/colorPrimaryDark</item>
        <item name="colorAccent">@color/colorAccent</item>
    </style>

    <style name="AppTheme.NoActionBar" parent="Theme.AppCompat.NoActionBar">
        <item name="windowActionBar">false</item>
        <item name="windowNoTitle">true</item>
        <item name="android:background">@null</item>
    </style>

    <style name="AppTheme.NoActionBar.Fullscreen" parent="AppTheme.NoActionBar">
        <item name="android:windowFullscreen">true</item>
        <item name="android:windowContentOverlay">@null</item>
        <item name="android:windowLayoutInDisplayCutoutMode">shortEdges</item>
        <item name="android:windowTranslucentStatus">true</item>
        <item name="android:windowTranslucentNavigation">true</item>
        <item name="android:statusBarColor">@android:color/transparent</item>
        <item name="android:navigationBarColor">@android:color/transparent</item>
        <item name="android:windowDrawsSystemBarBackgrounds">false</item>
    </style>

</resources>
EOF

      - name: Enable edge-to-edge
        run: |
          MAINACTIVITY=$(find android -name "MainActivity.java" | head -1)
          if [ -n "$MAINACTIVITY" ]; then
            echo "MainActivity found: $MAINACTIVITY"
          fi

      - name: Sync web assets
        run: npx cap sync android

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: openworld-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
