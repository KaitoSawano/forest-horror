name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        run: |
          mkdir -p $ANDROID_HOME/cmdline-tools
          cd $ANDROID_HOME/cmdline-tools
          if [ ! -d "latest" ]; then
            wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O cmdline.zip
            unzip -q cmdline.zip
            mv cmdline-tools latest || true
          fi
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" > /dev/null

      - name: Install dependencies
        run: npm install

      - name: Compile WASM
        run: |
          sudo apt-get update
          sudo apt-get install -y wabt
          wat2wasm tools/decrypt.wat -o src/lib/decrypt.wasm || true

      - name: Encrypt JavaScript
        run: node tools/encrypt.js

      - name: Update webDir
        run: |
          sed -i 's/"webDir": "[^"]*"/"webDir": "src-encrypted"/' capacitor.config.json

      - name: Add Android platform
        run: npx cap add android

      - name: Set Android SDK path
        run: echo "sdk.dir=$ANDROID_HOME" > android/local.properties

      - name: Force landscape orientation
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          sed -i 's/android:screenOrientation="[^"]*"/android:screenOrientation="landscape"/g' $MANIFEST
          if ! grep -q 'android:screenOrientation' $MANIFEST; then
            sed -i 's/<activity/<activity android:screenOrientation="landscape"/' $MANIFEST
          fi

      - name: Add fullscreen style to styles.xml
        run: |
          STYLES=android/app/src/main/res/values/styles.xml
          echo "=== styles.xml SEBELUM ==="
          cat $STYLES
          
          # Hapus dulu kalau sudah ada (biar tidak dobel)
          sed -i '/AppTheme.NoActionBar.Fullscreen/,/<\/style>/d' $STYLES
          
          # Tambah style fullscreen sebelum </resources>
          python3 -c "
import sys
path = '$STYLES'
with open(path, 'r') as f:
    content = f.read()

fullscreen_style = '''    <style name=\"AppTheme.NoActionBar.Fullscreen\" parent=\"AppTheme.NoActionBar\">
        <item name=\"android:windowFullscreen\">true</item>
        <item name=\"android:windowContentOverlay\">@null</item>
        <item name=\"android:windowLayoutInDisplayCutoutMode\">shortEdges</item>
        <item name=\"android:statusBarColor\">@android:color/transparent</item>
        <item name=\"android:navigationBarColor\">@android:color/transparent</item>
        <item name=\"android:windowDrawsSystemBarBackgrounds\">false</item>
    </style>

</resources>'''

content = content.replace('</resources>', fullscreen_style)

with open(path, 'w') as f:
    f.write(content)
print('Fullscreen style added')
"
          
          echo \"=== styles.xml SESUDAH ===\"
          cat $STYLES

      - name: Apply fullscreen theme to manifest
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          if grep -q 'android:theme="@style/AppTheme.NoActionBar"' $MANIFEST; then
            sed -i 's|android:theme="@style/AppTheme.NoActionBar"|android:theme="@style/AppTheme.NoActionBar.Fullscreen"|' $MANIFEST
            echo "Theme replaced with Fullscreen"
          fi
          grep 'android:theme' $MANIFEST || echo "No theme found"

      - name: Enable immersive fullscreen in MainActivity
        run: python3 tools/patch-fullscreen.py

      - name: Sync web assets
        run: npx cap sync android

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: umbragrove-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
