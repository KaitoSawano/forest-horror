<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Umbra Grove</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <canvas id="game"></canvas>

  <div id="book-counter">Object 0/7</div>

  <div id="joystick-base">
    <div id="joystick-knob"></div>
  </div>

  <button id="jump-btn">↑</button>

  <div id="crosshair">+</div>

  <button id="map-btn"></button>

  <div id="map-overlay">
    <button id="map-close">✕</button>
    <canvas id="minimap"></canvas>
  </div>

  <div id="menu">
    <h1 id="menu-title">UMBRA GROVE</h1>
    <div id="menu-buttons">
      <button class="menu-btn" id="btn-play">MULAI</button>
      <button class="menu-btn" id="btn-help">CARA MAIN</button>
      <button class="menu-btn" id="btn-quit">KELUAR</button>
    </div>
  </div>

  <div id="help-overlay">
    <h2>CARA MAIN</h2>
    <ul>
      <li><b>Joystick kiri bawah</b> — bergerak</li>
      <li><b>Geser sisi kanan layar</b> — lihat sekeliling</li>
      <li><b>Tombol ↑</b> — lompat</li>
      <li><b>Tombol peta</b> — buka peta</li>
      <li>Kumpulkan <b>7 buku merah</b> di hutan</li>
    </ul>
    <button id="help-close">TUTUP</button>
  </div>

  <div id="gameover-overlay">
    <h1 id="gameover-title">GAME OVER!</h1>
    <p id="gameover-sub">Kamu berhasil mengumpulkan semua buku.</p>
    <button id="btn-restart">MAIN LAGI</button>
  </div>

  <div id="debug"></div>

  <script type="importmap">
  {
    "imports": {
      "three": "./lib/three.module.js",
      "three/addons/loaders/GLTFLoader.js": "./lib/GLTFLoader.js",
      "three/addons/utils/BufferGeometryUtils.js": "./lib/BufferGeometryUtils.js"
    }
  }
  </script>

  <script src="./loader.js"></script>
</body>
</html>
